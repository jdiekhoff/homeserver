services:
  # Single image since v1.0 (frontend + API). Traefik routes via the docker
  # provider defaultRule: service name "mealie" -> mealie.${HOST}, port 9000.
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    networks:
      - network
    deploy:
      resources:
        limits:
          memory: 1000M
    environment:
      - ALLOW_SIGNUP=false
      - PUID=1000
      - PGID=1000
      - TZ=America/Indiana/Indianapolis
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      - BASE_URL=https://mealie.${HOST}
    volumes:
      - /mnt/docker-data/mealie/data:/app/data/
    restart: unless-stopped

networks:
  network:
    driver: bridge
