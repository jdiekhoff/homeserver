services:
  syncthing:
    image: syncthing/syncthing
    environment:
      - PUID=${UID}
      - PGID=${GID}
    networks:
      - network
    volumes:
      - /mnt/docker-data/syncthing:/var/syncthing
    expose:
      - 8384
      - 22000
    # ports:
    #   - 8384:8384 # Web UI
    #   - 22000:22000/tcp # TCP file transfers
    #   - 22000:22000/udp # QUIC file transfers
    #   - 21027:21027/udp # Receive local discovery broadcasts
    labels:
      - traefik.http.services.syncthing.loadbalancer.server.port=8384
      - traefik.tcp.routers.syncthing-ft.entryPoints=syncthing-ft-tcp
      - traefik.tcp.routers.syncthing-ft.service=syncthing-ft
      - traefik.tcp.routers.syncthing-ft.rule=HostSNI(`*`)
      - traefik.tcp.services.syncthing-ft.loadbalancer.server.port=22000
      - traefik.udp.routers.syncthing-ft.entryPoints=syncthing-ft-udp
      - traefik.udp.routers.syncthing-ft.service=syncthing-ft
      - traefik.udp.services.syncthing-ft.loadbalancer.server.port=22000
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  network:
    driver: bridge
